<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAI Chat</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #f5f5f5 0%, #e9f1ff 100%);
        color: #10223a;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }
      .card {
        width: min(900px, 100%);
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 24px 60px rgba(16, 34, 58, 0.18);
        padding: 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: #55637c;
      }
      form {
        display: grid;
        gap: 16px;
      }
      textarea {
        width: 100%;
        min-height: 140px;
        resize: vertical;
        padding: 14px 16px;
        border: 1px solid #c9d5e8;
        border-radius: 12px;
        font-size: 16px;
        line-height: 1.4;
      }
      button {
        justify-self: start;
        background: #10223a;
        color: #ffffff;
        border: none;
        padding: 12px 20px;
        border-radius: 999px;
        font-size: 15px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(16, 34, 58, 0.2);
      }
      .output {
        margin-top: 24px;
        padding: 18px;
        border-radius: 14px;
        background: #f6f8fb;
        border: 1px solid #dbe4f2;
        min-height: 80px;
        white-space: pre-wrap;
      }
      .status {
        font-size: 13px;
        color: #7a879d;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Send a message</h1>
      <p>Type your message and send it to the Node.js backend, which will forward it to OpenAI.</p>
      <form id="chat-form">
        <textarea id="message" name="message" placeholder="Type something..." required></textarea>
        <button type="submit">Send</button>
      </form>
      <div class="output" id="output">The reply will appear here.</div>
      <div class="status" id="status"></div>
      <div class="status" id="request-id"></div>
    </main>

    <script>
      const form = document.getElementById('chat-form');
      const messageInput = document.getElementById('message');
      const output = document.getElementById('output');
      const status = document.getElementById('status');
      const requestIdEl = document.getElementById('request-id');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = messageInput.value.trim();
        if (!message) {
          return;
        }

        status.textContent = 'Sending...';
        requestIdEl.textContent = '';
        output.textContent = 'Waiting for reply...';

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ message })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data?.error || 'Request failed');
          }

          output.textContent = data.reply || '(empty response)';
          status.textContent = 'Done.';
          if (data.requestId) {
            requestIdEl.textContent = `request_id: ${data.requestId}`;
          }
        } catch (error) {
          status.textContent = 'Error.';
          output.textContent = error instanceof Error ? error.message : 'Unexpected error';
          if (error && typeof error === 'object' && 'requestId' in error) {
            requestIdEl.textContent = `request_id: ${error.requestId}`;
          }
        }
      });
    </script>
  </body>
</html>
